name: astrbot_plugin_dafeiyu_douyin
display_name: 大肥鱼·抖音见闻
short_desc: 把她真的看过、停留过的抖音作品，用她自己的语气发给你
desc: |
  接在 DSH 的刷抖音插件后面：读它每天生成的日报，挑出「有停留依据」的 1-2 条，
  用大肥鱼自己的人格写成 QQ 私聊里那样的一两句话发给你，附作品链接。
  - 每天定时一次（默认 21:30），只发当天新看过、且真的停留过的那几条；
  - 每周提炼一次「我最近爱看什么」，存成本机周记，并在对话里作为她自己的见闻注入；
  - 只读日报文件，不写回抖音插件、不碰别的记忆库；关掉插件即完全失效。
  - 它是本机优先的：不上传、不分享，只发给你自己的号。
version: 1.0.0
author: dafeiyu
astrbot_version: ">=4.9.0"
support_platforms:
  - aiocqhttp
